<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta
      name="description"
      content="留言管理后台。需要管理员登录和 visitor_messages 权限。"
    >
    <title>留言管理</title>
    <link rel="icon" href="../../assets/icon.svg" type="image/svg+xml">
    <link rel="stylesheet" href="./messages.css">
    <script src="../../debug-logger-core.js?v=20260711-debug-v4" defer></script>
    <script src="../../debug-logger.js?v=20260711-debug-v4" defer></script>
    <script src="../../auth.js" defer></script>
    <script src="./messages.js" defer></script>
  </head>
  <body>
    <main class="messages-shell" aria-labelledby="messages-title">
      <header class="messages-header">
        <a class="messages-back" href="../../hub.html">返回 Hub</a>
        <p class="messages-kicker">管理员数据</p>
        <h1 id="messages-title">留言管理</h1>
        <p class="messages-lede">
          这里读取数据库中的访客留言。页面需要管理员角色和 visitor_messages 权限；
          删除操作仅做软删除，可以恢复。
        </p>
      </header>

      <section class="messages-auth" data-messages-denied hidden>
        <h2>无法访问留言管理</h2>
        <p data-messages-denied-text>正在检查权限...</p>
        <a class="messages-back" href="../../login.html">前往登录</a>
      </section>

      <section class="messages-dashboard" data-messages-content hidden>
        <div class="messages-toolbar">
          <div class="messages-summary" data-messages-summary aria-label="留言统计"></div>
          <button class="messages-action" type="button" data-messages-refresh>刷新</button>
        </div>

        <form class="messages-filters" data-messages-filters>
          <label>
            <span>状态</span>
            <select name="status">
              <option value="">全部状态</option>
              <option value="new">新留言</option>
              <option value="read">已读</option>
              <option value="archived">归档</option>
            </select>
          </label>
          <label>
            <span>数据范围</span>
            <select name="dataScope">
              <option value="">全部范围</option>
              <option value="production">production</option>
              <option value="test">test</option>
              <option value="demo">demo</option>
              <option value="imported">imported</option>
            </select>
          </label>
          <label>
            <span>搜索</span>
            <input name="search" type="search" placeholder="昵称、联系方式、内容或备注">
          </label>
          <label class="messages-checkbox">
            <input name="highlighted" type="checkbox">
            <span>只看高亮</span>
          </label>
          <label class="messages-checkbox">
            <input name="includeDeleted" type="checkbox">
            <span>包含软删除</span>
          </label>
          <button class="messages-action" type="submit">应用筛选</button>
        </form>

        <p class="messages-status" data-messages-status aria-live="polite"></p>

        <div class="messages-table-wrap">
          <table class="messages-table">
            <thead>
              <tr>
                <th>ID</th>
                <th>时间</th>
                <th>昵称</th>
                <th>联系方式</th>
                <th>状态</th>
                <th>范围</th>
                <th>内容</th>
                <th>操作</th>
              </tr>
            </thead>
            <tbody data-messages-list></tbody>
          </table>
        </div>
      </section>

      <dialog class="messages-detail" data-message-detail>
        <form method="dialog">
          <button class="messages-detail__close" type="submit" aria-label="关闭详情">&times;</button>
        </form>
        <article data-message-detail-body></article>
      </dialog>

      <dialog
        class="messages-detail messages-confirm"
        data-message-delete-dialog
        aria-labelledby="message-delete-title"
      >
        <form method="dialog">
          <button
            class="messages-detail__close"
            type="submit"
            aria-label="取消删除"
            data-message-delete-cancel
          >
            &times;
          </button>
        </form>
        <h2 id="message-delete-title">确认软删除</h2>
        <p data-message-delete-summary></p>
        <p>
          确定删除这条留言吗？留言将移入已删除列表，之后仍可恢复。
          本操作不会永久删除数据。
        </p>
        <div class="messages-detail__actions">
          <button class="messages-action" type="button" data-message-delete-cancel>取消</button>
          <button class="messages-action messages-action--danger" type="button" data-message-delete-confirm>
            确认软删除
          </button>
        </div>
      </dialog>
    </main>
  </body>
</html>
