<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>MAO Yifan - Personal_Web</title>
    <meta
      name="description"
      content="Hello, World! Welcome to MAO Yifan's corner of the web. More is on the way."
    >
    <link rel="icon" href="./assets/icon.svg" type="image/svg+xml">
    <link rel="stylesheet" href="./styles.css">
    <script src="./debug-logger-core.js?v=20260711-debug-v4" defer></script>
    <script src="./debug-logger.js?v=20260711-debug-v4" defer></script>
    <script src="./auth.js" defer></script>
    <script src="./script.js" defer></script>
  </head>
  <body>
    <main class="hero" aria-labelledby="page-title">
      <section class="hero-copy" aria-label="Homepage introduction">
        <h1 id="page-title">Hello, <span>World!</span></h1>
        <p>Welcome to MAO Yifan's corner of the web.</p>
        <p>More is on the way.</p>
      </section>

      <a
        class="user-entrance visible-entrance visible-entrance--user"
        href="./login.html"
        aria-label="Open user entrance"
        data-user-entrance
      >
        <span class="visible-entrance__label">用户入口</span>
        <span class="entrance-status-badge" data-user-unavailable-badge hidden>暂未开放</span>
      </a>
      <a
        class="visitor-entrance visible-entrance visible-entrance--visitor"
        href="./journey.html?view=public"
        aria-label="Open visitor entrance"
        data-visitor-entrance
      >
        <span class="visible-entrance__label">访客入口</span>
      </a>
      <p
        class="local-start-status"
        data-local-start-status
        aria-live="polite"
        hidden
      ></p>
    </main>

    <div class="floating-tools" aria-label="Floating website tools">
      <button
        class="floating-tool-button"
        type="button"
        data-message-open
        aria-haspopup="dialog"
        aria-controls="feature-availability-dialog"
      >
        <span class="floating-tool-button__label">留言</span>
        <span class="entrance-status-badge">暂未开放</span>
      </button>
    </div>
    <div
      class="feature-availability-dialog"
      id="feature-availability-dialog"
      role="dialog"
      aria-modal="true"
      aria-labelledby="feature-availability-title"
      aria-describedby="feature-availability-message"
      hidden
    >
      <div class="feature-availability-dialog__overlay" data-feature-notice-close></div>
      <section class="feature-availability-dialog__panel" tabindex="-1">
        <button
          class="feature-availability-dialog__close"
          type="button"
          data-feature-notice-close
          aria-label="关闭提示"
        >&times;</button>
        <p class="feature-availability-dialog__eyebrow">Coming soon</p>
        <h2 id="feature-availability-title" data-feature-notice-title></h2>
        <p id="feature-availability-message" data-feature-notice-message></p>
      </section>
    </div>
    <a
      class="local-debug-link"
      href="./debug-log.html"
      data-local-debug-link
      hidden
    >本地调试日志</a>
    <footer class="site-footer" aria-label="Site filing information">
      <a
        class="site-footer__link"
        href="https://beian.miit.gov.cn/"
        target="_blank"
        rel="noopener noreferrer"
      >&#36195;ICP&#22791;2026013131&#21495;-1</a>
      <a
        class="site-footer__link site-footer__gongan"
        href="https://beian.mps.gov.cn/#/query/webSearch?code=36030202000491"
        target="_blank"
        rel="noopener noreferrer"
      >
        <img
          class="site-footer__icon"
          src="./assets/beian/gongan.png"
          alt=""
          aria-hidden="true"
        >
        <span>&#36195;&#20844;&#32593;&#23433;&#22791;36030202000491&#21495;</span>
      </a>
    </footer>
  </body>
</html>
