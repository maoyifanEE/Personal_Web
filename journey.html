<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Journey Canvas - Personal_Web</title>
    <meta
      name="description"
      content="Journey canvas public preview with admin-only local editing controls."
    >
    <link rel="icon" href="./assets/icon.svg" type="image/svg+xml">
    <link rel="stylesheet" href="./journey.css?v=20260705-node-gallery-v1">
    <script src="./debug-logger.js" defer></script>
    <script src="./auth.js" defer></script>
    <script src="./journey-curve-import-core.js" defer></script>
    <script src="./journey.js?v=20260705-node-gallery-v1" defer></script>
  </head>
  <body data-page="home">
    <main
      class="timeline-home"
      data-view="overview"
      data-editor-mode="preview"
      aria-labelledby="page-title"
    >
      <a class="journey-back-link" href="./index.html">Back to homepage</a>

      <h1 class="sr-only" id="page-title">Journey sketch canvas</h1>

      <section class="journey-map" aria-label="Journey canvas workspace">
        <div class="timeline-floating-controls">
          <div
            class="timeline-view-switch"
            role="group"
            aria-label="Timeline view switch"
          >
            <button type="button" data-view-button="overview" aria-pressed="true">
              Overview
            </button>
            <button type="button" data-view-button="details" aria-pressed="false">
              Details
            </button>
          </div>

          <button type="button" class="editor-toggle" data-editor-toggle hidden>
            Edit journey
          </button>
        </div>
        <div class="journey-areas" id="journey-areas"></div>
      </section>
    </main>

    <div
      class="timeline-event-popover"
      id="timeline-event-popover"
      role="region"
      aria-labelledby="timeline-popover-title"
      hidden
    ></div>

    <div class="context-editor-root" id="context-editor-root" aria-live="polite"></div>

    <footer class="site-footer" aria-label="Site filing information">
      <a
        class="site-footer__link"
        href="https://beian.miit.gov.cn/"
        target="_blank"
        rel="noopener noreferrer"
      >&#36195;ICP&#22791;2026013131&#21495;-1</a>
      <a
        class="site-footer__link site-footer__gongan"
        href="https://beian.mps.gov.cn/#/query/webSearch?code=36030202000491"
        target="_blank"
        rel="noopener noreferrer"
      >
        <img
          class="site-footer__icon"
          src="./assets/beian/gongan.png"
          alt=""
          aria-hidden="true"
        >
        <span>&#36195;&#20844;&#32593;&#23433;&#22791;36030202000491&#21495;</span>
      </a>
    </footer>
  </body>
</html>
